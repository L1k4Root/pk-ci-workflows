# Reusable CI for Node.js / TypeScript projects managed with pnpm.
#
# Runs, in order: install (frozen lockfile) -> lint -> typecheck -> test -> build.
# Each step only runs if the matching script exists in package.json, so the
# same workflow works for a tiny library and for a full service.
#
# Usage:
#   jobs:
#     ci:
#       uses: L1k4Root/pk-ci-workflows/.github/workflows/node-ci.yml@v1
#       with:
#         node-version: "24"
name: node-ci

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version to use.
        type: string
        default: "24"
      working-directory:
        description: Directory that contains package.json.
        type: string
        default: "."
      upload-coverage:
        description: Upload ./coverage as a build artifact when present.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          # Uses the "packageManager" field from package.json when present.
          package_json_file: ${{ inputs.working-directory }}/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run --if-present lint

      - name: Typecheck
        run: pnpm run --if-present typecheck

      - name: Test
        run: pnpm run --if-present test

      - name: Build
        run: pnpm run --if-present build

      - name: Upload coverage
        if: inputs.upload-coverage && hashFiles(format('{0}/coverage/**', inputs.working-directory)) != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage-node
          path: ${{ inputs.working-directory }}/coverage
          retention-days: 7
